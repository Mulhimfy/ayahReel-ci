# A test APK of a branch, to install beside the store app.
#
# Built when a pushed commit's message carries `[apk]` (or by hand from
# the Actions tab once this file is on main). It is a plain
# `flutter build apk`, not a Shorebird release: nothing here reaches the
# store, no patch can target it, and nothing is published but a GitHub
# pre-release in this private repo.
#
# It installs NEXT TO the store app rather than over it: its application
# id is `com.ayahreel.app.preview` and its name "AyahReel Preview", set
# below on the runner's checkout only. The store app is signed by Play
# App Signing, so no APK built here could replace it anyway, and a phone
# keeps its reels and settings. Signed with the upload key from the repo
# secrets, so each preview installs over the one before it.
#
# arm64 only: every phone this app supports in practice, and a third of
# the universal APK's size (see LAUNCH.md).
#
# Flutter is flutter_version.txt's, the one the store builds use, so the
# phone runs the engine that ships (tool/check_flutter_version.sh).
name: Preview APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: apk-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium || true
          df -h / | tail -1
      # flutter_version.txt: the Flutter the store builds use. The check
      # stops here if anything builds or tests on another one.
      - name: Flutter version
        id: flutter
        run: |
          v=$(bash tool/check_flutter_version.sh)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - name: Make it a preview that installs beside the store app
        run: |
          set -euo pipefail
          sed -i 's/applicationId = "com.ayahreel.app"/applicationId = "com.ayahreel.app.preview"/' \
            android/app/build.gradle.kts
          sed -i 's/android:label="AyahReel"/android:label="AyahReel Preview"/' \
            android/app/src/main/AndroidManifest.xml
          grep -q '"com.ayahreel.app.preview"' android/app/build.gradle.kts
          grep -q 'android:label="AyahReel Preview"' android/app/src/main/AndroidManifest.xml
          sed -i 's/-Xmx8G/-Xmx4G/' android/gradle.properties
      - name: Signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "No keystore secret: the APK is signed with a throwaway debug key."
            exit 0
          fi
          # Secrets set from PowerShell arrive with a BOM and CRLFs.
          printf '%s' "$KEYSTORE_B64" | perl -pe 's/^\xEF\xBB\xBF//; s/[\r\n ]//g' \
            | base64 -d > "$RUNNER_TEMP/upload.jks"
          STORE_PASSWORD="${STORE_PASSWORD%$'\r'}"
          KEY_PASSWORD="${KEY_PASSWORD%$'\r'}"
          KEY_ALIAS="${KEY_ALIAS%$'\r'}"
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" \
              -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::warning::The keystore secrets don't open the keystore; signing with a throwaway debug key."
            exit 0
          fi
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties
      - name: Build
        env:
          # The key the app reads its own word timing with: a build
          # without it has none (lib/data/words_host.dart).
          WORDS_KEY: ${{ secrets.WORDS_KEY }}
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=WORDS_KEY="$WORDS_KEY"
      - name: Name it
        id: apk
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA::7}"
          BRANCH="$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          NAME="ayahreel-preview-${BRANCH}-${SHORT}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$NAME"
          ls -lh "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 14
      - name: Publish as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.apk.outputs.name }}
          SHORT: ${{ steps.apk.outputs.short }}
        run: |
          set -euo pipefail
          TAG="preview-${SHORT}"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Preview APK · ${GITHUB_REF_NAME} · ${SHORT}" \
            --notes "Test build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}. Installs beside the store app as **AyahReel Preview** (com.ayahreel.app.preview). Not a store build, not patchable."
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${NAME}" >> "$GITHUB_STEP_SUMMARY"
