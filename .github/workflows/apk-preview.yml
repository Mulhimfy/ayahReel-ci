name: Preview APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: commit
        required: true
      name:
        description: label
        default: preview

concurrency:
  group: apk-preview-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Mulhimfy/ayahReel
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.APP_DEPLOY_KEY }}
          persist-credentials: false
      - if: hashFiles('listen_ref.txt') != ''
        uses: ./.github/actions/listen-engine
        with:
          deploy-key: ${{ secrets.LISTEN_DEPLOY_KEY }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium || true
          df -h / | tail -1
      - name: Flutter version
        id: flutter
        run: |
          v=$(bash tool/check_flutter_version.sh)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - name: Make it a preview that installs beside the store app
        run: |
          set -euo pipefail
          sed -i 's/applicationId = "com.ayahreel.app"/applicationId = "com.ayahreel.app.preview"/' \
            android/app/build.gradle.kts
          sed -i 's/android:label="AyahReel"/android:label="AyahReel Preview"/' \
            android/app/src/main/AndroidManifest.xml
          grep -q '"com.ayahreel.app.preview"' android/app/build.gradle.kts
          grep -q 'android:label="AyahReel Preview"' android/app/src/main/AndroidManifest.xml
          sed -i 's/-Xmx8G/-Xmx4G/' android/gradle.properties
      - name: Signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "No keystore secret: the APK is signed with a throwaway debug key."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | perl -pe 's/^\xEF\xBB\xBF//; s/[\r\n ]//g' \
            | base64 -d > "$RUNNER_TEMP/upload.jks"
          STORE_PASSWORD="${STORE_PASSWORD%$'\r'}"
          KEY_PASSWORD="${KEY_PASSWORD%$'\r'}"
          KEY_ALIAS="${KEY_ALIAS%$'\r'}"
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" \
              -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::warning::The keystore secrets don't open the keystore; signing with a throwaway debug key."
            exit 0
          fi
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties
      - name: Build
        env:
          WORDS_KEY: ${{ secrets.WORDS_KEY }}
        run: |
          set -euo pipefail
          mkdir -p out
          flutter pub get > out/build.txt 2>&1
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=WORDS_KEY="$WORDS_KEY" >> out/build.txt 2>&1 ||
            { grep -iE 'error|failed' out/build.txt | tail -5; exit 1; }
      - name: Name it
        env:
          LABEL: ${{ inputs.name }}
        run: |
          set -euo pipefail
          SHORT="$(git rev-parse --short=7 HEAD)"
          LABEL="$(printf '%s' "$LABEL" | tr -c 'A-Za-z0-9._-' '-')"
          NAME="ayahreel-preview-${LABEL}-${SHORT}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "out/$NAME"
          ls -l "out/$NAME" | awk '{print $5" bytes"}'
      - name: Seal
        if: always()
        env:
          K: ${{ secrets.AR_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          [ -n "$K" ] || { echo "No AR_ARTIFACT_KEY: nothing kept." >&2; exit 1; }
          mkdir -p out
          tar czf - -C out . | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -pass env:K -out sealed.bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sealed
          path: sealed.bin
          retention-days: 7
          if-no-files-found: ignore
