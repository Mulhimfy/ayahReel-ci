name: Desk previews

on:
  workflow_dispatch:
    inputs:
      ref:
        description: commit
        required: true
      tools:
        description: 'test/tools files to run, without _test.dart, space-separated'
        default: 'batch_preview arena_preview card_preview notification_art_preview'
      encode:
        description: 'Encode the reels export_motion_tool writes, and measure them'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Mulhimfy/ayahReel
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.APP_DEPLOY_KEY }}
          persist-credentials: false
      - if: hashFiles('listen_ref.txt') != ''
        uses: ./.github/actions/listen-engine
        with:
          deploy-key: ${{ secrets.LISTEN_DEPLOY_KEY }}
      - name: Flutter version
        id: flutter
        run: |
          v=$(bash tool/check_flutter_version.sh)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Draw
        env:
          TOOLS: ${{ inputs.tools || 'batch_preview arena_preview card_preview notification_art_preview' }}
        run: |
          mkdir -p previews
          for tool in $TOOLS; do
            dir="$PWD/previews/$tool"
            mkdir -p "$dir"
            BATCH_PREVIEW_OUT="$dir" ARENA_PREVIEW_OUT="$dir" \
            CARD_PREVIEW_OUT="$dir" STYLE_PREVIEW_OUT="$dir" \
            NOTIF_PREVIEW_OUT="$dir" INVITE_STORY_OUT="$dir" \
            LINES_PREVIEW_OUT="$dir" EXPORT_MOTION_OUT="$dir" \
            SHAPE_PREVIEW_OUT="$dir" \
              flutter test "test/tools/${tool}_test.dart" > "$dir/run.txt" 2>&1 \
              || echo "::warning::a tool did not finish"
          done
          find previews -name '*.png' | wc -l
      - name: Encode the export tool's reels
        if: ${{ inputs.encode }}
        run: |
          ls previews/*/cmd_*.txt >/dev/null 2>&1 || exit 0
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          for dir in previews/*; do
          ls "$dir"/cmd_*.txt >/dev/null 2>&1 || continue
          ffmpeg -version | head -1 > "$dir/encode_report.txt"
          for c in "$dir"/cmd_*.txt; do
            name=$(basename "$c" .txt); name=${name#cmd_}
            inputs=$(grep -o ' -i ' "$c" | wc -l)
            /usr/bin/time -v ffmpeg -hide_banner -v error -y \
              $(sed 's/"//g' "$c") 2> "$dir/time_$name.txt" \
              || echo "::warning::a reel did not encode"
            peak=$(awk '/Maximum resident/ {print int($6/1024)}' "$dir/time_$name.txt")
            wall=$(awk -F': ' '/Elapsed \(wall clock\)/ {print $2}' "$dir/time_$name.txt")
            echo "$name: $inputs inputs, ${peak} MB peak, $wall" >> "$dir/encode_report.txt"
            for at in 2 9 36; do
              ffmpeg -v error -y -ss "$at" -i "$dir/reel_$name.mp4" -frames:v 1 \
                "$dir/frame_${name}_${at}s.png" || true
            done
            rm -f "$dir/reel_$name.mp4"
          done
          done
      - name: Seal
        if: always()
        env:
          K: ${{ secrets.AR_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          [ -n "$K" ] || { echo "No AR_ARTIFACT_KEY: nothing kept." >&2; exit 1; }
          mkdir -p previews
          tar czf - -C previews . | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -pass env:K -out sealed.bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sealed
          path: sealed.bin
          retention-days: 7
          if-no-files-found: ignore
