# Does the Android app build, and how big are its native libraries? A release
# APK for arm64 built and measured, nothing signed with the upload key,
# uploaded or published. Runs on a pushed commit whose message carries
# `[android]`, or by hand.
name: Android build check

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[android]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/listen-engine
        with:
          deploy-key: ${{ secrets.LISTEN_DEPLOY_KEY }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium || true
      - name: Flutter version
        id: flutter
        run: |
          v=$(bash tool/check_flutter_version.sh)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - name: Build (debug-signed release)
        run: |
          set -euo pipefail
          sed -i 's/-Xmx8G/-Xmx4G/' android/gradle.properties
          flutter pub get
          flutter build apk --release --target-platform android-arm64
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -lh "$APK"
          unzip -l "$APK" | grep -E 'lib/.*\.so' | sort -k1 -n -r | head -20
