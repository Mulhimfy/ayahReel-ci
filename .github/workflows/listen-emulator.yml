# AyahReel Listen on an Android emulator (x86_64): the integration test
# integration_test/listen_test.dart, which fetches the model with the app's
# key and hears the bundled Al-Fatiha recordings through the app's own ONNX
# Runtime and engine. Nothing is uploaded. Runs on a pushed commit whose
# message carries `[emulator]`, or by hand.
name: Listen on an emulator

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[emulator]')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/listen-engine
        with:
          deploy-key: ${{ secrets.LISTEN_DEPLOY_KEY }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Flutter version
        id: flutter
        run: |
          v=$(bash tool/check_flutter_version.sh)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - name: Get packages
        run: |
          sed -i 's/-Xmx8G/-Xmx4G/' android/gradle.properties
          flutter pub get
      - name: Test on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          WORDS_KEY: ${{ secrets.WORDS_KEY }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          # one line: the runner runs each line on its own; the test's own exit
          # code is the step's
          script: sh -c 'flutter test integration_test/listen_test.dart --dart-define=WORDS_KEY="$WORDS_KEY" -d emulator-5554 > /tmp/t.txt 2>&1; c=$?; grep -E "LISTEN|All tests|Some tests|EXCEPTION|Exception|Error|error:|FAILED|passed|failed" /tmp/t.txt | head -80; exit $c'
