name: Symbolize

on:
  workflow_dispatch:
    inputs:
      ref:
        description: commit
        required: true
      release:
        description: release
        required: true
      addrs:
        description: addresses
        required: true

permissions:
  contents: read

jobs:
  symbolize:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      RELEASE_VERSION: ${{ inputs.release }}
      ADDRS: ${{ inputs.addrs }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Mulhimfy/ayahReel
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.APP_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules || true
      - name: Install Shorebird
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh | bash
          for d in "$HOME/.config/shorebird/bin" "$HOME/.shorebird/bin"; do
            if [ -x "$d/shorebird" ]; then echo "$d" >> "$GITHUB_PATH"; fi
          done
      - name: Build as the patch was (dry run)
        env:
          WORDS_KEY: ${{ secrets.WORDS_KEY }}
        run: |
          set +e
          bash tool/sync-version.sh "$RELEASE_VERSION" > /dev/null
          sed -i 's/-Xmx8G/-Xmx4G/' android/gradle.properties
          shorebird --verbose patch android --release-version="$RELEASE_VERSION" \
            --dry-run -- --dart-define=WORDS_KEY="$WORDS_KEY" > build.log 2>&1
          echo "status=$?" > verdict.txt
          exit 0
      - name: Look up the addresses
        run: |
          set +e
          mkdir -p out
          GS=$(ls "$HOME"/.config/shorebird/bin/cache/flutter/*/bin/cache/artifacts/engine/android-arm64-release/linux-x64/gen_snapshot | head -1)
          DILL=$(ls .dart_tool/flutter_build/*/app.dill | head -1)
          BUILT=$(dirname "$DILL")/arm64-v8a/app.so
          cp "$BUILT" out/app.so
          "$GS" --deterministic --snapshot_kind=app-aot-elf --elf=out/again.so \
            --strip --save-debugging-info=out/app.android-arm64.symbols "$DILL" \
            > out/gen_snapshot.log 2>&1
          if cmp -s out/app.so out/again.so; then echo "identical=1"; else echo "identical=0"; fi >> verdict.txt
          SYM=$(ls /usr/bin/llvm-symbolizer* /usr/lib/llvm-*/bin/llvm-symbolizer 2>/dev/null | sort -V | tail -1)
          for a in $ADDRS; do
            c=$(printf '0x%x' $((a - 4)))
            echo "== $a"
            "$SYM" --obj=out/app.android-arm64.symbols --inlining --functions=linkage "$c"
          done > out/symbolized.txt 2>&1
          grep -c '^== ' out/symbolized.txt > /dev/null && echo "looked=1" >> verdict.txt
      - name: Blank secrets out of the logs
        if: always()
        env:
          WORDS_KEY: ${{ secrets.WORDS_KEY }}
          REDACT_VARS: SHOREBIRD_TOKEN WORDS_KEY
        run: python3 tool/redact_logs.py build.log verdict.txt
      - name: Seal
        if: always()
        env:
          K: ${{ secrets.AR_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          [ -n "$K" ] || { echo "No AR_ARTIFACT_KEY: nothing kept." >&2; exit 1; }
          mkdir -p out
          rm -f out/again.so
          cp build.log verdict.txt out/ 2>/dev/null || true
          tar czf - -C out . | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -pass env:K -out sealed.bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sealed
          path: sealed.bin
          retention-days: 14
          if-no-files-found: ignore
      - name: Done
        run: grep -q 'identical=1' verdict.txt
