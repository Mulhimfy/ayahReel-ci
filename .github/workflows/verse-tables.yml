# Makes verse tables from the audio with tool/verse_table.py, measures
# them, and checks them as tool/verify_reciters.py checks any table.
#
# A push to a voices-* branch whose head commit message carries
# [tables] runs it, for each job set named after it on that line
# (tool/verse_table_jobs.json):
#
#   [tables] calib
#
# Each job makes the tables of one recording's surahs with the Quran
# acoustic model of Mulhimfy/ayahreel-words (checked out at a fixed
# commit) and uploads them, JSON only, as an artifact. The summary job
# then measures each recording's tables against the references and its
# published table, where it has them, and runs the verifier's checks on
# them (the summary is in its log and on the run's page). Nothing is
# published but the artifacts, which are public like everything on the
# mirror: delete a run's artifacts once its tables are in the app. Its
# one secret is WORDS_DEPLOY_KEY, read-only, for the private
# Mulhimfy/ayahreel-words.
#
# The account's 20 runners are shared with the owner's builds and the
# word-timing job: four tables at a time, two screens, one such run at
# a time.
name: Verse tables

on:
  push:
    branches: ['voices-**']

permissions:
  contents: read

env:
  WORDS_SHA: af8fc300c5125b3a6ebc4ae2119880f6d2367df4

jobs:
  plan:
    if: contains(github.event.head_commit.message, '[tables]')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      screens: ${{ steps.p.outputs.screens }}
      summary: ${{ steps.p.outputs.summary }}
      runs: ${{ steps.p.outputs.runs }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: python3 -I tool/verse_table.py plan >> "$GITHUB_OUTPUT"

  screen:
    needs: plan
    if: needs.plan.outputs.screens != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJson(needs.plan.outputs.screens) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/workflows/verse-tables.yml
      - name: Tools
        timeout-minutes: 40
        run: |
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          pip install -q --timeout 60 --retries 5 numpy==1.26.4
      - name: Screen
        env:
          JOB: ${{ toJson(matrix) }}
        run: |
          ref=$(jq -r .ref <<<"$JOB"); base=$(jq -r .base <<<"$JOB")
          flags=""
          [ "$(jq -r '.padded // true' <<<"$JOB")" = false ] && flags="--unpadded"
          surahs=$(jq -r '.surahs // empty' <<<"$JOB")
          mkdir -p screen
          python3 -I tool/verse_table.py screen --ref "$ref" --cand "$base" \
            ${surahs:+--surahs "$surahs"} $flags --json "screen/${{ matrix.name }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-${{ matrix.name }}
          path: screen
          retention-days: 14

  make:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Mulhimfy/ayahreel-words
          ref: ${{ env.WORDS_SHA }}
          path: words
          # Private since 2026-10-24: a read-only deploy key.
          ssh-key: ${{ secrets.WORDS_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: words/requirements.txt
      - name: Tools
        # pip's cache is per branch: a cold one has taken torch 40 minutes.
        timeout-minutes: 60
        run: |
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          pip install -q --timeout 60 --retries 5 torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q --timeout 60 --retries 5 -r words/requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: verse-tables-models-rabah8-v1
      - name: Make
        env:
          JOB: ${{ toJson(matrix) }}
        run: |
          id=$(jq -r .id <<<"$JOB"); base=$(jq -r .base <<<"$JOB")
          surahs=$(jq -r .surahs <<<"$JOB")
          flags=""
          [ "$(jq -r '.padded // true' <<<"$JOB")" = false ] && flags="--unpadded"
          [ "$(jq -r '.keep_logp // false' <<<"$JOB")" = true ] && flags="$flags --keep-logp"
          python tool/verse_table.py make --words words --id "$id" \
            --base "$base" --surahs "$surahs" --out out --work work $flags
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tables-${{ matrix.name }}
          path: out
          retention-days: 14

  summary:
    needs: [plan, make]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.summary != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Mulhimfy/ayahreel-words
          ref: ${{ env.WORDS_SHA }}
          path: words
          # Private since 2026-10-24: a read-only deploy key.
          ssh-key: ${{ secrets.WORDS_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/workflows/verse-tables.yml
      - name: Tools
        timeout-minutes: 40
        run: |
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          pip install -q --timeout 60 --retries 5 numpy==1.26.4
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.matrix != '[]'
        with:
          pattern: tables-*
          path: out
          merge-multiple: true
      - name: Tables from earlier runs
        if: needs.plan.outputs.runs != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ needs.plan.outputs.runs }}
        run: |
          for r in $RUNS; do
            gh run download "$r" -R "$GITHUB_REPOSITORY" -p 'tables-*' -D "earlier/$r"
          done
          mkdir -p out
          # Each artifact holds <id>/<surah>.json; a surah made twice is
          # taken from the later run.
          for d in earlier/*/*/*/; do cp -r "$d" out/; done
          ls out
      - name: Measure and check
        env:
          MATRIX: ${{ needs.plan.outputs.summary }}
        run: |
          mkdir -p summary
          for id in $(jq -r '[.[].id] | unique | .[]' <<<"$MATRIX"); do
            job=$(jq -c --arg id "$id" '[.[] | select(.id == $id)][0]' <<<"$MATRIX")
            truth=$(jq -r '.truth // empty' <<<"$job")
            pub=$(jq -r '.published // empty' <<<"$job")
            base=$(jq -r .base <<<"$job")
            pad=$(jq -r 'if (.padded // true) then "SSS" else "S" end' <<<"$job")
            echo "::group::$id"
            python3 -I tool/verse_table.py eval --words words --tables "out/$id" \
              ${truth:+--truth "$truth"} ${pub:+--published "$pub"} \
              --json "summary/eval_$id.json" || true
            VERSE_TABLES_DIR=out python3 -I tool/verify_reciters.py \
              --check "surah $base $pad own $id" > "summary/check_$id.txt" 2>&1 || true
            tail -n 60 "summary/check_$id.txt"
            echo "::endgroup::"
          done
          python3 -I - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, json
          print('| table | verses vs truth | median | p90 | p99 | max | >300 ms | vs published (verse 2+) median/p90 | passes |')
          print('|---|---|---|---|---|---|---|---|---|')
          for f in sorted(glob.glob('summary/eval_*.json')):
              d = json.load(open(f))
              t = d.get('against_truth') or {}
              p = d.get('against_published') or {}
              print(f"| {f[13:-5]} | {t.get('n')} | {t.get('median')} | {t.get('p90')} | "
                    f"{t.get('p99')} | {t.get('max')} | {t.get('over300')} | "
                    f"{p.get('median')}/{p.get('p90')} | {d.get('passes')} |")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: summary
          path: summary
          retention-days: 14
