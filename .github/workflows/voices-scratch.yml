# Scratch: research runs for new voices and recordings. Not for main.
name: Voices (scratch)

on:
  push:
    branches: ['**']

permissions:
  contents: write

jobs:
  voices:
    if: contains(github.event.head_commit.message, '[voices]')
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [taraweeh]
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-numpy >/dev/null
          ffmpeg -version | head -1
          python3 -I -c 'import numpy; print("numpy", numpy.__version__)'
      - name: Run
        env:
          SHARD: ${{ matrix.shard }}
        run: bash tool/voices_scratch/run.sh "$SHARD"
      - name: Publish
        if: always()
        env:
          TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
        run: |
          [ -d out ] || exit 0
          cd out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898276+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b out
          git add -A
          git commit -qm "voices run $GITHUB_RUN_ID $SHARD"
          git push -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/voices-out/$GITHUB_RUN_ID-$SHARD"
          echo "published voices-out/$GITHUB_RUN_ID-$SHARD"
